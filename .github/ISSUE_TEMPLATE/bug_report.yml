name: Bug report
description: Something in Game Spelunker does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** attach extracted game files or assets. If you can, reproduce the
        problem with the `TestGame` project from this repository.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which step?
      options:
        - 1 · Game (finding / choosing a game)
        - 2 · Build report
        - 3 · AssetRipper install
        - 4 · Extract
        - 5 · Explore
        - Other
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity Editor version
      placeholder: 6000.3.13f1
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game's Unity version and scripting backend
      description: Shown in the build report (for example "2022.3.21f1, IL2CPP").
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: textarea
    id: log
    attributes:
      label: Console output / AssetRipper log
      description: Paste errors from the Unity Console and the "AssetRipper log" foldout.
      render: text
