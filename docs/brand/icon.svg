<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231a33"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffb347" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9f2e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3f8c"/>
      <stop offset="1" stop-color="#2c1d47"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2b66"/>
      <stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3a2d52" stroke-width="4"/>

  <!-- Stalactites -->
  <path d="M120 18 L138 18 L129 66 Z M184 18 L206 18 L195 92 Z M318 18 L336 18 L327 58 Z M372 18 L388 18 L380 80 Z" fill="#1a1426"/>

  <!-- Lamp beam falling onto the open cube -->
  <path d="M112 132 L360 250 L248 330 Z" fill="url(#beam)"/>
  <circle cx="112" cy="132" r="22" fill="#ffd27a"/>
  <circle cx="112" cy="132" r="40" fill="#ffb347" opacity="0.25" filter="url(#soft)"/>
  <circle cx="112" cy="132" r="10" fill="#fff6dc"/>

  <!-- Cube (the game), its top opened -->
  <g transform="translate(256 300)">
    <!-- inner glow seen through the opening -->
    <ellipse cx="0" cy="-58" rx="92" ry="44" fill="#ffb347" opacity="0.45" filter="url(#soft)"/>
    <!-- left face -->
    <path d="M-130 -62 L0 12 L0 162 L-130 88 Z" fill="url(#left)"/>
    <!-- right face -->
    <path d="M130 -62 L0 12 L0 162 L130 88 Z" fill="url(#right)"/>
    <!-- opening: the inside of the cube, lit -->
    <path d="M-130 -62 L0 -136 L130 -62 L0 12 Z" fill="url(#glow)"/>
    <!-- grid of the insides (assets, scenes, scripts) -->
    <g stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65">
      <path d="M-87 -87 L43 -13"/>
      <path d="M-43 -111 L87 -37"/>
      <path d="M-87 -37 L43 -111"/>
      <path d="M-43 -13 L87 -87"/>
    </g>
    <!-- lid, flipped open to the back -->
    <path d="M-130 -62 L0 -136 L-26 -214 L-156 -140 Z" fill="#6d4ca8" opacity="0.95"/>
    <path d="M-130 -62 L0 -136" stroke="#c7a8ff" stroke-width="5" stroke-linecap="round"/>
    <!-- edges -->
    <g fill="none" stroke="#a98be0" stroke-width="5" stroke-linejoin="round">
      <path d="M-130 -62 L0 12 L130 -62"/>
      <path d="M0 12 L0 162"/>
      <path d="M-130 -62 L-130 88 L0 162 L130 88 L130 -62"/>
    </g>
  </g>

  <!-- Pickaxe -->
  <g transform="translate(400 402) rotate(-38)">
    <rect x="-7" y="-10" width="14" height="96" rx="6" fill="#8b6a4a"/>
    <path d="M-62 -6 Q0 -40 62 -6 L58 4 Q0 -22 -58 4 Z" fill="#cfd3dc"/>
  </g>
</svg>
