<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Flat mark: a game (cube) with its lid open and the inside lit. Three colors, no gradients. -->
  <rect width="512" height="512" rx="112" fill="#1b1726"/>
  <g transform="translate(256 286)" stroke-linejoin="round" stroke-linecap="round">
    <!-- inside, lit -->
    <path d="M-132 -66 L0 -142 L132 -66 L0 10 Z" fill="#ffb347"/>
    <!-- open lid, tilted back -->
    <path d="M-132 -66 L0 -142 L-34 -222 L-166 -146 Z" fill="#1b1726" stroke="#efe9ff" stroke-width="22"/>
    <!-- body -->
    <path d="M-132 -66 L0 10 L132 -66 L132 86 L0 162 L-132 86 Z" fill="#2b2440" stroke="#efe9ff" stroke-width="22"/>
    <path d="M0 10 L0 162" stroke="#efe9ff" stroke-width="22"/>
    <!-- rim of the opening -->
    <path d="M0 -142 L132 -66" stroke="#efe9ff" stroke-width="22"/>
  </g>
</svg>
